<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаб. №4: форма</title>
  </head>
  <body>
    <h1>Форма реєстрації</h1>

<form action="https://httpbin.org/post" method="post">
  <p>
    <label for="username">Ім’я:</label>
    <input type="text" id="username" name="username">
  </p>

  <p>
    <label>Дата народження:
      <input type="date" name="birthdate">
    </label>
  </p>

  <p>
    <label for="email">Електронна пошта:</label>
    <input type="email" id="email" name="email">
  </p>

  <p>
    <label>Повідомлення:<br>
      <textarea name="message" rows="4" cols="30"></textarea>
    </label>
  </p>
  <fieldset>
  <legend>Ваші улюблені напої?</legend>
  <label><input type="checkbox" name="drinks" value="coffee"> Кава</label><br>
  <label><input type="checkbox" name="drinks" value="tea"> Чай</label><br>
  <label><input type="checkbox" name="drinks" value="juice"> Сік</label><br>
  <label><input type="checkbox" name="drinks" value="water"> Вода</label>
</fieldset>

<fieldset>
  <legend>Моя національність</legend>
  <label><input type="radio" name="nationality" value="ukrainian"> Українець</label><br>
  <label><input type="radio" name="nationality" value="hungarian"> Мадяр</label><br>
  <label><input type="radio" name="nationality" value="other"> Інша</label>
</fieldset>

  <button type="submit">Відправити</button>
  <button type="reset">Очистити</button>
</form>
    <picture>
  <source media="(max-width: 467px)" srcset="https://dummyimage.com/300x500/ccc/000.png&text=300x500">
  <img src="https://dummyimage.com/1000x400/ccc/000.png&text=1000x400" alt="Демонстраційне зображення" style="max-width: 100%; height: auto;">
</picture>

    <script src="./script.js"></script>
  </body>
</html>
